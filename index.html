<!DOCTYPE html>
<html>
<head>
  <title>Loading...</title>
</head>
<body>
  <script>
    const params = new URLSearchParams(window.location.search);
    const id = params.get('id') || 'unknown';
    const img = new Image();
    img.src = `/api/track?id=${id}`;
    document.body.appendChild(img);
  </script>
  <p>Loading image...</p>
</body>
</html>
